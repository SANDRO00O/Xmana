name: Build Xmana

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate localization parity and repository rules
        run: python3 tools/validate_localization.py

  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild src/Xmana.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build (x64, Release)
        run: >
          msbuild src/Xmana.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=false
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir="${{ github.workspace }}\AppPackages\"
          /m

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xmana-x64-release
          path: |
            AppPackages/**
            src/Xmana.App/bin/x64/Release/**
          if-no-files-found: warn
