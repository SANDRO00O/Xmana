name: Build Xmana for Xbox Dev Mode
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate app icons and splash screen
        shell: pwsh
        run: ./tools/Generate-Assets.ps1
      - name: Install Universal Windows Platform MSBuild support
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $installerRoot = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          $installer = Join-Path $installerRoot 'setup.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          if (-not (Test-Path $installer)) { throw "Visual Studio Installer was not found at $installer" }
          $installationPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $installationPath) { throw 'Visual Studio 2022 installation was not found.' }
          & $installer modify --installPath "$installationPath" --channelId VisualStudio.17.Release --add Microsoft.VisualStudio.ComponentGroup.UWP.Support --quiet --norestart
          $installExitCode = $LASTEXITCODE
          if ($installExitCode -ne 0 -and $installExitCode -ne 3010) {
            throw "Adding UWP MSBuild support failed with exit code $installExitCode."
          }
          $searchRoots = @(
            (Join-Path $programFilesX86 'MSBuild'),
            (Join-Path $installationPath 'MSBuild')
          ) | Where-Object { Test-Path $_ }
          $targetFiles = @(
            foreach ($root in $searchRoots) {
              Get-ChildItem -Path $root -Filter 'Microsoft.Windows.UI.Xaml.CSharp.targets' -File -Recurse -ErrorAction SilentlyContinue
            }
          )
          if (-not $targetFiles) {
            $rootsText = ($searchRoots -join '; ')
            throw "UWP XAML MSBuild target file was not found. Searched: $rootsText"
          }
          Write-Host "Found UWP XAML targets: $($targetFiles[0].FullName)"
          $msbuildPath = Join-Path $installationPath 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $msbuildPath)) { throw "MSBuild.exe was not found at $msbuildPath." }
          "MSBUILD_PATH=$msbuildPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore NuGet packages
        run: nuget restore Xmana.sln -NonInteractive
      - name: Build unsigned x64 UWP package
        shell: pwsh
        run: |
          $packages = Join-Path $env:GITHUB_WORKSPACE 'artifacts\AppPackages\'
          New-Item -ItemType Directory -Force -Path $packages | Out-Null
          if (-not (Test-Path $env:MSBUILD_PATH)) { throw "MSBuild executable is missing: $env:MSBUILD_PATH" }
          & $env:MSBUILD_PATH Xmana.sln /m /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageDir="$packages" /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw 'UWP package build failed.' }
      - name: Create temporary Xbox development signing certificate
        shell: pwsh
        timeout-minutes: 3
        run: ./tools/New-DevSigningCertificate.ps1

      - name: Sign generated APPX packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $programFilesX86 'Windows Kits\10\bin\*\x64\signtool.exe') | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          $certUtil = Join-Path $env:WINDIR 'System32\certutil.exe'
          try {
            if (-not $signtool) { throw 'Windows SDK SignTool was not found.' }
            $packages = Get-ChildItem 'artifacts\AppPackages' -Recurse -File -Filter 'Xmana_*.appx'
            if (-not $packages) { throw 'No APPX package was produced by MSBuild.' }
            foreach ($package in $packages) {
              Write-Host "Signing $($package.Name)."
              & $signtool.FullName sign /fd SHA256 /f $env:PFX_PATH /p $env:PFX_PASSWORD $package.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($package.Name)." }
              & $signtool.FullName verify /pa /v $package.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($package.Name)." }
            }
          }
          finally {
            if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) {
              Remove-Item -Force $env:PFX_PATH -ErrorAction SilentlyContinue
            }
            if ($env:CERT_THUMBPRINT -and (Test-Path $certUtil)) {
              foreach ($storeName in @('Root', 'TrustedPeople')) {
                & $certUtil -user -Silent -delstore $storeName $env:CERT_THUMBPRINT
                if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Could not remove the temporary certificate from CurrentUser\$storeName."
                }
              }
            }
          }
      - name: Prepare install bundle
        shell: pwsh
        run: |
          $packages = Get-ChildItem 'artifacts\AppPackages' -Recurse -File -Filter 'Xmana_*.appx'
          if (-not $packages) { throw 'No signed package remains after signing.' }
          Get-FileHash $packages.FullName -Algorithm SHA256 | Format-Table -AutoSize
          @'
          # Xbox Developer Mode install
          1. Open Xbox Device Portal while the console is in Developer Mode.
          2. In Apps > Deploy apps, upload the signed .appx package.
          3. Upload Xmana-Dev-Certificate.cer in the certificate field.
          4. Select Install. Keep the .cer with this exact build; each workflow run creates a new development certificate.
          This certificate is only for development/testing, not for Microsoft Store or production distribution.
          '@ | Set-Content 'artifacts\INSTALL-XBOX.txt'
      - name: Upload signed Xbox package and certificate
        uses: actions/upload-artifact@v4
        with:
          name: Xmana-Xbox-DevMode-x64
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
